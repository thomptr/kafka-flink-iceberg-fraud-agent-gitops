apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: flink-system
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - configmaps
      - secrets
      - events
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - replicasets
      - statefulsets
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: flink-system
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: flink-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: sample-fraud-stream
  namespace: flink-system
spec:
  image: flink:1.18
  flinkVersion: v1_18
  serviceAccount: flink
  jobManager:
    resource:
      memory: 1024m
      cpu: 1
  taskManager:
    resource:
      memory: 1024m
      cpu: 1
  job:
    jarURI: local:///opt/flink/examples/streaming/TopSpeedWindowing.jar
    parallelism: 1
    upgradeMode: stateless
