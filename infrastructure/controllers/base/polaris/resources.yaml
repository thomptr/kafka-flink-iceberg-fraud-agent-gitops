apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: apache-polaris
  namespace: flux-system
spec:
  interval: 1h
  url: https://downloads.apache.org/polaris/helm-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
  namespace: polaris
spec:
  interval: 30m
  chart:
    spec:
      chart: polaris
      version: 1.3.0-incubating
      sourceRef:
        kind: HelmRepository
        name: apache-polaris
        namespace: flux-system
  values:
    replicaCount: 1
    image:
      tag: 1.3.0-incubating
    persistence:
      type: in-memory
    realmContext:
      realms:
        - POLARIS
    storage:
      secret:
        name: polaris-storage-credentials
        awsAccessKeyId: awsAccessKeyId
        awsSecretAccessKey: awsSecretAccessKey
    livenessProbe:
      failureThreshold: 6
    readinessProbe:
      failureThreshold: 6
    extraEnv:
      - name: POLARIS_BOOTSTRAP_CREDENTIALS
        valueFrom:
          secretKeyRef:
            name: polaris-bootstrap-credentials
            key: credentials
      - name: AWS_REGION
        value: us-east-1
      # Some Polaris S3 paths use the AWS SDK default credential provider (not only
      # polaris.storage.aws.*). Without these, table creation can 500 with
      # SdkClientException: Unable to load credentials from any of the providers.
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: polaris-storage-credentials
            key: awsAccessKeyId
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: polaris-storage-credentials
            key: awsSecretAccessKey
