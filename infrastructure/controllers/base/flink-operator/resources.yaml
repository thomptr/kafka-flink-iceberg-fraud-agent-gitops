apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flink-kubernetes-operator
  namespace: flux-system
spec:
  interval: 1h
  ref:
    branch: main
  url: https://github.com/apache/flink-kubernetes-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flink-kubernetes-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./helm/flink-kubernetes-operator/templates
  prune: true
  sourceRef:
    kind: GitRepository
    name: flink-kubernetes-operator
  targetNamespace: flink-system
  timeout: 10m
