apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds-stable
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.fairwinds.com/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
  namespace: polaris
spec:
  interval: 30m
  chart:
    spec:
      chart: polaris
      version: 5.*
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
