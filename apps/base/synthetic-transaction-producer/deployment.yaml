apiVersion: v1
kind: ServiceAccount
metadata:
  name: synthetic-transaction-producer
  namespace: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-transaction-producer
  namespace: kafka
  labels:
    app.kubernetes.io/name: synthetic-transaction-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-transaction-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-transaction-producer
    spec:
      serviceAccountName: synthetic-transaction-producer
      containers:
        - name: producer
          image: synthetic-transaction-producer:latest
          # Local image only (not on a registry). Build + load into Minikube; see README.
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: transactions
            - name: EVENTS_PER_SEC
              value: "20"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
