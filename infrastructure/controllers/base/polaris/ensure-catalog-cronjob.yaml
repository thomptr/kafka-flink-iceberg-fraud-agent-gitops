apiVersion: batch/v1
kind: CronJob
metadata:
  name: polaris-ensure-quickstart-catalog
  namespace: polaris
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ensure
              image: python:3.12-slim
              command:
                - sh
                - -c
                - pip install --no-cache-dir -q boto3 botocore && python3 /scripts/ensure_polaris_catalog.py
              env:
                - name: POLARIS_BOOTSTRAP_CREDENTIALS
                  valueFrom:
                    secretKeyRef:
                      name: polaris-bootstrap-credentials
                      key: credentials
                - name: POLARIS_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: polaris-storage-credentials
                      key: awsAccessKeyId
                - name: POLARIS_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: polaris-storage-credentials
                      key: awsSecretAccessKey
                - name: POLARIS_CATALOG_URI
                  value: http://polaris.polaris.svc.cluster.local:8181/api/catalog
                - name: POLARIS_CATALOG_NAME
                  value: quickstart_catalog
                - name: POLARIS_DEFAULT_BASE_LOCATION
                  value: s3://iceberg-warehouse/polaris
                - name: POLARIS_MINIO_ENDPOINT
                  value: http://minio.minio.svc.cluster.local:9000
                - name: POLARIS_MINIO_INTERNAL_ENDPOINT
                  value: http://minio.minio.svc.cluster.local:9000
                - name: POLARIS_REGION
                  value: us-east-1
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: ensure-polaris-catalog-script
                defaultMode: 0755
