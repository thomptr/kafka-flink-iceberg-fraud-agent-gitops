apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monitoring
patches:
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: add
        path: /spec/values/grafana/service
        value:
          type: NodePort
      - op: add
        path: /spec/values/prometheus/prometheusSpec/resources
        value:
          requests:
            cpu: 250m
            memory: 1Gi
