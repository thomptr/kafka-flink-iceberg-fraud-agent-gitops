apiVersion: v1
kind: ServiceAccount
metadata:
  name: synthetic-transaction-producer
  namespace: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-transaction-producer
  namespace: kafka
  labels:
    app.kubernetes.io/name: synthetic-transaction-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-transaction-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-transaction-producer
    spec:
      serviceAccountName: synthetic-transaction-producer
      # Wait until Strimzi has created the bootstrap Service and something accepts :9092.
      initContainers:
        - name: wait-kafka-bootstrap
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              max=120
              while [ "$i" -lt "$max" ]; do
                if nc -z -w 2 platform-cluster-kafka-bootstrap 9092; then
                  echo "Kafka bootstrap reachable"
                  exit 0
                fi
                echo "waiting for platform-cluster-kafka-bootstrap:9092 ($i/$max)..."
                sleep 3
                i=$((i+1))
              done
              echo "timed out waiting for Kafka bootstrap (is Kafka/Strimzi running?)"
              exit 1
      containers:
        - name: producer
          image: synthetic-transaction-producer:latest
          # Local image only (not on a registry). Build + load into Minikube; see README.
          imagePullPolicy: Never
          env:
            # Same namespace as Strimzi Kafka — short DNS name (see README if this fails).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-cluster-kafka-bootstrap:9092
            - name: KAFKA_TOPIC
              value: transactions
            - name: EVENTS_PER_SEC
              value: "20"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
