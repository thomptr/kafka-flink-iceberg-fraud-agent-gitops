apiVersion: v1
kind: ServiceAccount
metadata:
  name: synthetic-transaction-producer
  namespace: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-transaction-producer
  namespace: kafka
  labels:
    app.kubernetes.io/name: synthetic-transaction-producer
spec:
  replicas: 1
  # Recreate: terminate old pod(s) before creating new — never overlap (RollingUpdate can still
  # briefly show two pods when one is stuck Terminating/Error beside the new ReplicaSet).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-transaction-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-transaction-producer
    spec:
      serviceAccountName: synthetic-transaction-producer
      # Wait until Strimzi has created the bootstrap Service and something accepts :9092.
      initContainers:
        - name: wait-kafka-bootstrap
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              max=120
              while [ "$i" -lt "$max" ]; do
                if nc -z -w 2 platform-cluster-kafka-bootstrap 9092; then
                  echo "Kafka bootstrap reachable"
                  exit 0
                fi
                echo "waiting for platform-cluster-kafka-bootstrap:9092 ($i/$max)..."
                sleep 3
                i=$((i+1))
              done
              echo "timed out waiting for Kafka bootstrap (is Kafka/Strimzi running?)"
              exit 1
      containers:
        - name: producer
          image: synthetic-transaction-producer:latest
          # Local image only (not on a registry). Build + load into Minikube; see README.
          imagePullPolicy: Never
          ports:
            - name: control
              containerPort: 8080
          env:
            # Same namespace as Strimzi Kafka — short DNS name (see README if this fails).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-cluster-kafka-bootstrap:9092
            - name: KAFKA_TOPIC
              value: transactions
            - name: EVENTS_PER_SEC
              value: "20"
            - name: CONTROL_PORT
              value: "8080"
          # Liveness is disabled until startup succeeds (avoids killing the container during slow Kafka connect).
          startupProbe:
            httpGet:
              path: /health
              port: control
            failureThreshold: 36
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
