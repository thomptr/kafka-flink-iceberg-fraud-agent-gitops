apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: flink-system
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - configmaps
      - secrets
      - events
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - replicasets
      - statefulsets
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: flink-system
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: flink-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: sample-fraud-stream
  namespace: flink-system
spec:
  image: flink-sql-runner:1.18
  flinkVersion: v1_18
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    state.backend: rocksdb
    execution.checkpointing.interval: "60000"
    state.checkpoints.dir: s3://iceberg-warehouse/flink-checkpoints
    state.savepoints.dir: s3://iceberg-warehouse/flink-savepoints
    fs.s3a.endpoint: http://minio.minio.svc.cluster.local:9000
    fs.s3a.path.style.access: "true"
    fs.s3a.connection.ssl.enabled: "false"
    fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
    metrics.reporter.prom.port: "9249"
  jobManager:
    resource:
      memory: 1024m
      cpu: 1
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            ports:
              - name: metrics
                containerPort: 9249
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: minio-flink-s3-credentials
                    key: rootUser
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-flink-s3-credentials
                    key: rootPassword
            volumeMounts:
              - name: flink-streaming-sql
                mountPath: /opt/flink/sql
                readOnly: true
        volumes:
          - name: flink-streaming-sql
            configMap:
              name: flink-streaming-sql
  taskManager:
    resource:
      memory: 1024m
      cpu: 1
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            ports:
              - name: metrics
                containerPort: 9249
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: minio-flink-s3-credentials
                    key: rootUser
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-flink-s3-credentials
                    key: rootPassword
  job:
    jarURI: local:///opt/flink/lib/sql-runner.jar
    entryClass: org.example.fraud.flink.SqlRunner
    args:
      - "/opt/flink/sql/flink_streaming_job.sql"
    parallelism: 1
    upgradeMode: last-state
