apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kubeflow-manifests
  namespace: flux-system
spec:
  interval: 1h
  ref:
    branch: master
  url: https://github.com/kubeflow/manifests
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubeflow
  namespace: flux-system
spec:
  interval: 30m
  path: ./example
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubeflow-manifests
  targetNamespace: kubeflow
  timeout: 20m
