apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kafbat-ui
  namespace: flux-system
spec:
  interval: 1h
  url: https://kafbat.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka-ui
  namespace: kafka-ui
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kafka-ui
      version: 1.6.x
      sourceRef:
        kind: HelmRepository
        name: kafbat-ui
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Strimzi Kafka cluster (plain listener on 9092). See https://ui.docs.kafbat.io/
    yamlApplicationConfig:
      kafka:
        clusters:
          - name: platform-cluster
            bootstrapServers: platform-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
      auth:
        type: disabled
      management:
        health:
          ldap:
            enabled: false
