apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/fraud-alert-agent
images:
  - name: fraud-alert-agent
    newTag: "0.1.1"
configMapGenerator:
  - name: fraud-agent-config
    behavior: merge
    literals:
      - INVESTIGATION_UI_BASE_URL=http://localhost:8502
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: fraud-alert-agent
