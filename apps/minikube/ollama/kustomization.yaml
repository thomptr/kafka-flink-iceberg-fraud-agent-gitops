apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/ollama
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: "nvidia.com/gpu"
            operator: Exists
            effect: NoSchedule
    target:
      kind: Deployment
      name: ollama
